<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vulnerability scan recall by cost</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .viz-root {
    color-scheme: light;
    --page:           #faf9f5;
    --surface-1:      #ffffff;
    --text-primary:   #191817;
    --text-secondary: #55534d;
    --text-muted:     #85837b;
    --grid:           #e7e5dc;
    --axis:           #191817;
    --series-1:       #2a78d6;
    --series-2:       #eb6834;
    --series-3:       #1baf7a;
    --series-4:       #a83c9c;

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;

    font-family: var(--sans);
    background: var(--page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --axis:           #c3c2b7;
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --series-4:       #c45fb5;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #c3c2b7;
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c45fb5;
  }

  .stack { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

  .card {
    width: 1200px; max-width: 100%;
    background: var(--surface-1);
    border-radius: 26px;
    padding: 52px 56px 40px;
  }

  .hd { text-align: center; margin-bottom: 22px; }
  .hd h1 {
    font-size: 46px; line-height: 1.08; font-weight: 700; letter-spacing: -0.027em;
    margin: 0 0 12px; color: var(--text-primary);
  }
  .hd .sub {
    font-family: var(--serif); font-size: 25px; line-height: 1.25; font-weight: 400;
    margin: 0; color: var(--text-secondary);
  }

  .plot { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }

  .fnote {
    margin: 26px 0 0; font-size: 13px; line-height: 1.6; color: var(--text-muted);
  }
  .desc {
    margin: 10px 0 0; max-width: 62ch;
    font-size: 13px; line-height: 1.6; color: var(--text-muted);
  }

  .capture details.tv { display: none; }
  details.tv { margin-top: 20px; }
  details.tv summary { cursor: pointer; font-size: 12.5px; color: var(--text-muted); }
  table { border-collapse: collapse; margin-top: 12px; font-size: 12.5px;
          font-variant-numeric: tabular-nums; width: 100%; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid rgba(25,24,23,0.09); }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--text-muted); font-weight: 600; }

  .tip {
    position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -100%);
    background: var(--surface-1); border: 1px solid rgba(25,24,23,0.12); border-radius: 10px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.12); padding: 11px 13px; font-size: 12.5px;
    color: var(--text-primary); white-space: nowrap; transition: opacity .1s; z-index: 5;
  }
  .tip .t-title { font-weight: 660; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .tip .t-row { color: var(--text-secondary); font-variant-numeric: tabular-nums; line-height: 1.5; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; display: inline-block; }
</style>
</head>
<body>
<div class="viz-root">
<div class="stack">

  <figure class="card" id="fig">
    <div class="hd">
      <h1>Vulnerability scan recall by cost</h1>
      <p class="sub">OWASP scan</p>
    </div>

    <div class="plot"><div id="plot"></div><div class="tip" id="tip"></div></div>

    <p class="fnote">*Estimated model cost for self hosting at a large organization.</p>

    <p class="desc">
      The results are of an AI scanner agent harness run on a web application codebase
      (OWASP Juice Shop). The harness was designed to scan and identify the top 30 OWASP
      vulnerabilities.
    </p>

    <details class="tv"><summary>Table view</summary>
      <table>
        <thead><tr><th>Model</th><th>Recall score</th><th>Total evaluation cost</th><th>Cost per vulnerability</th><th>Total tokens</th><th>Cost basis</th></tr></thead>
        <tbody>
          <tr><td>GPT-5.6 Luna</td><td>88.7% (86/97)</td><td>$4.37</td><td>$0.045</td><td>9,618,943</td><td>metered API spend</td></tr>
          <tr><td>Claude Sonnet 5</td><td>86.6% (84/97)</td><td>$84.04</td><td>$0.866</td><td>23,098,383</td><td>CLI transport — see note</td></tr>
          <tr><td>GLM-5.2</td><td>85.6% (83/97)</td><td>$7.33*</td><td>$0.076</td><td>9,668,297</td><td>self-hosted estimate</td></tr>
          <tr><td>Gemini 3.6 Flash</td><td>75.3% (73/97)</td><td>$24.85</td><td>$0.256</td><td>9,381,580</td><td>metered API spend</td></tr>
        </tbody>
      </table>
    </details>
  </figure>

</div>
</div>

<script>
/* Recall  = localization within +/-15 lines, over the 97 reachable ground-truth entries.
   Cost    = metered run cost, except GLM-5.2, which carries an estimated self-hosting
             cost for a large organization and is starred on the figure. The metered
             figure for that run was $17.01 against the vendor API.
   Cost per vulnerability = cost / 97. Carried in the tooltips and table, not plotted. */
const MODELS = [
  { name:'GPT-5.6 Luna',     cost:4.37,  recall:88.7, hits:86, tokens:'9,618,943',  costBasis:'metered API spend',      slot:1 },
  { name:'GLM-5.2',          cost:7.33,  recall:85.6, hits:83, tokens:'9,668,297',  costBasis:'self-hosted equivalent', slot:2, star:true },
  { name:'Gemini 3.6 Flash', cost:24.85, recall:75.3, hits:73, tokens:'9,381,580',  costBasis:'metered API spend',      slot:3 },
  { name:'Claude Sonnet 5',  cost:84.04, recall:86.6, hits:84, tokens:'23,098,383', costBasis:'CLI transport',          slot:4 },
];

const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}) => { const n = document.createElementNS(NS, t);
  for (const k in a) if (a[k] !== undefined && a[k] !== null) n.setAttribute(k, a[k]); return n; };
const txt = (s, a = {}) => { const n = el('text', a); n.textContent = s; return n; };
const S = i => `var(--series-${i})`;

(function () {
  const W = 1088, H = 470;
  const M = { t: 24, r: 40, b: 96, l: 96 };
  const x0 = M.l, x1 = W - M.r, y0 = M.t, y1 = H - M.b;
  /* Log cost axis: the four runs span $4.37 to $84.04, a 19x range. On a linear
     axis Luna and GLM-5.2 land 19px apart and their marks overlap. */
  const XD = [3, 120], YD = [70, 94];
  const lg = Math.log;
  const sx = v => x0 + (lg(v) - lg(XD[0])) / (lg(XD[1]) - lg(XD[0])) * (x1 - x0);
  const sy = v => y1 - (v - YD[0]) / (YD[1] - YD[0]) * (y1 - y0);

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': 'Recall score against total evaluation cost. GPT-5.6 Luna 88.7 percent at $4.37. Claude Sonnet 5 86.6 percent at $84.04. GLM-5.2 85.6 percent at $7.33. Gemini 3.6 Flash 75.3 percent at $24.85.' });

  /* vertical hairline grid */
  [5, 10, 20, 50, 100].forEach(v => {
    svg.appendChild(el('line', { x1: sx(v), x2: sx(v), y1: y0, y2: y1, stroke: 'var(--grid)', 'stroke-width': 1 }));
    svg.appendChild(txt('$' + v, { x: sx(v), y: y1 + 30, 'text-anchor': 'middle', 'font-size': 15,
      fill: 'var(--text-secondary)', 'font-variant-numeric': 'tabular-nums' }));
  });

  /* y ticks, no y rule */
  for (let v = 70; v <= 90; v += 5) {
    svg.appendChild(txt(v, { x: x0 - 18, y: sy(v) + 5.5, 'text-anchor': 'end', 'font-size': 15,
      fill: 'var(--text-secondary)', 'font-variant-numeric': 'tabular-nums' }));
  }

  /* solid baseline */
  svg.appendChild(el('line', { x1: x0, x2: x1, y1: y1, y2: y1, stroke: 'var(--axis)', 'stroke-width': 1.6 }));

  /* axis titles */
  svg.appendChild(txt('Total evaluation cost (USD, log scale)', { x: (x0 + x1) / 2, y: y1 + 66,
    'text-anchor': 'middle', 'font-size': 19, 'font-weight': 700, fill: 'var(--text-primary)',
    'letter-spacing': '-0.01em' }));
  svg.appendChild(txt('all models ran on high effort', { x: (x0 + x1) / 2, y: y1 + 88,
    'text-anchor': 'middle', 'font-size': 13, fill: 'var(--text-muted)' }));
  svg.appendChild(txt('Recall score (%)', { x: -(y0 + y1) / 2, y: 24, transform: 'rotate(-90)',
    'text-anchor': 'middle', 'font-size': 19, 'font-weight': 700, fill: 'var(--text-primary)',
    'letter-spacing': '-0.01em' }));

  /* direct labels — placed to keep the two low-cost points apart */
  const LBL = [
    { i: 0, dx:  20, dy: -44, anchor: 'start' },  /* Luna     — above right */
    { i: 1, dx:  20, dy:  34, anchor: 'start' },  /* GLM      — below right */
    { i: 2, dx: -20, dy: -44, anchor: 'end'   },  /* Gemini   — above left  */
    { i: 3, dx: -20, dy: -44, anchor: 'end'   },  /* Sonnet 5 — above left  */
  ];
  LBL.forEach(({ i, dx, dy, anchor }) => {
    const m = MODELS[i], px = sx(m.cost), py = sy(m.recall);
    svg.appendChild(txt(m.name, { x: px + dx, y: py + dy, 'text-anchor': anchor, 'font-size': 19,
      'font-weight': 700, fill: 'var(--text-primary)', 'letter-spacing': '-0.01em' }));
    svg.appendChild(txt(m.recall.toFixed(1) + '%  ·  $' + m.cost.toFixed(2) + (m.star ? '*' : ''), { x: px + dx, y: py + dy + 24,
      'text-anchor': anchor, 'font-size': 16, fill: 'var(--text-secondary)',
      'font-variant-numeric': 'tabular-nums' }));
  });

  /* dots last, each with a surface ring */
  MODELS.forEach(m => {
    const px = sx(m.cost), py = sy(m.recall);
    svg.appendChild(el('circle', { cx: px, cy: py, r: 13, fill: 'var(--surface-1)' }));
    svg.appendChild(el('circle', { cx: px, cy: py, r: 11, fill: S(m.slot) }));
    const hit = el('circle', { cx: px, cy: py, r: 24, fill: 'transparent', tabindex: 0, style: 'cursor:pointer' });
    svg.appendChild(hit);
    const tipEl = document.getElementById('tip'), host = document.getElementById('plot').parentElement;
    const html = `<div class="t-title"><span class="swatch" style="background:${S(m.slot)}"></span>${m.name}</div>
      <div class="t-row">Recall ${m.recall.toFixed(1)}% — ${m.hits} of 97 entries</div>
      <div class="t-row">$${m.cost.toFixed(2)} — ${m.costBasis}</div>
      <div class="t-row">$${(m.cost / 97).toFixed(3)} per vulnerability · ${m.tokens} tokens</div>`;
    const show = () => {
      tipEl.innerHTML = html;
      const hb = host.getBoundingClientRect(), b = hit.getBoundingClientRect();
      tipEl.style.left = (b.left - hb.left + b.width / 2) + 'px';
      tipEl.style.top  = (b.top - hb.top - 10) + 'px';
      tipEl.style.opacity = 1;
    };
    const hide = () => { tipEl.style.opacity = 0; };
    ['mouseenter', 'mousemove', 'focus'].forEach(e => hit.addEventListener(e, show));
    ['mouseleave', 'blur'].forEach(e => hit.addEventListener(e, hide));
  });

  document.getElementById('plot').appendChild(svg);
})();
</script>
</body>
</html>
